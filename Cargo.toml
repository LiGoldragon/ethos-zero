[package]
name         = "ethos-zero"
version      = "31.1.3"
edition      = "2024"
rust-version = "1.89"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/LiGoldragon/ethos-zero"
description  = "Ethos schema language version zero: reads ethos, generates Rust."
publish      = false
autobins     = false
autoexamples = false
autotests    = false

[lib]
name = "ethos_zero"
path = "src/lib.rs"

[[bin]]
name = "ethos-zero"
path = "src/main.rs"

[features]
default = ["datom"]
datom = []

[dependencies]
protos      = { git = "https://github.com/LiGoldragon/protos",  rev = "b3c5489a8d6d2d7a6b79cc6b21cc7c74d8119884", features = ["rkyv"] }
datom-codec = { git = "https://github.com/LiGoldragon/datom-codec", rev = "490d49ff6a6b07476da515da95ce70358d144621", features = ["rkyv"] }
quote       = "1"
proc-macro2 = "1"
syn         = { version = "3", features = ["full"] }
prettyplease = "0.3"
rkyv = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }

[[test]]
name = "ethos"
path = "tests/ethos.rs"

[[test]]
name = "generated"
path = "tests/generated.rs"

[[test]]
name = "freshness"
path = "tests/freshness.rs"

[[test]]
name = "nexus"
path = "tests/nexus.rs"

[[test]]
name = "print"
path = "tests/print.rs"

[[test]]
name = "cli"
path = "tests/cli.rs"

[lints.rust]
unsafe_code = "forbid"
unused      = { level = "warn", priority = -1 }
dead_code   = "warn"
