[package]
name         = "ethos-zero"
version      = "17.0.0"
edition      = "2024"
rust-version = "1.89"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/LiGoldragon/ethos-zero"
description  = "Ethos schema language version zero: reads ethos, generates Rust."
publish      = false
autobins     = false
autoexamples = false
autotests    = false

[lib]
name = "ethos_zero"
path = "src/lib.rs"

[[bin]]
name = "ethos-zero"
path = "src/main.rs"

[features]
default = ["datom"]
datom = []

[dependencies]
protos      = { git = "https://github.com/LiGoldragon/protos",  rev = "e667546f8cf80a98876df2165b2c9e3c413e40d2", features = ["rkyv"] }
datom-codec = { git = "https://github.com/LiGoldragon/datom-codec", rev = "dfecb24df5ce28c0b4ecfc3abc9663b42e2c1895", features = ["rkyv"] }
quote       = "1"
proc-macro2 = "1"
syn         = { version = "3", features = ["full"] }
prettyplease = "0.3"
rkyv = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }

[dev-dependencies]
serde = "1"

[[test]]
name = "ethos"
path = "tests/ethos.rs"

[[test]]
name = "generated"
path = "tests/generated.rs"

[[test]]
name = "freshness"
path = "tests/freshness.rs"

[[test]]
name = "signal-without-datom"
path = "tests/signal_without_datom.rs"

[[test]]
name = "flow-contract"
path = "tests/flow_contract.rs"

[[test]]
name = "print"
path = "tests/print.rs"

[[test]]
name = "cli"
path = "tests/cli.rs"

[[test]]
name = "proposals"
path = "tests/proposals.rs"

[lints.rust]
unsafe_code = "forbid"
unused      = { level = "warn", priority = -1 }
dead_code   = "warn"

