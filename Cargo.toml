[package]
name         = "ethos-zero"
version      = "6.0.0"
edition      = "2024"
rust-version = "1.89"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/LiGoldragon/ethos-zero"
description  = "Ethos schema language version zero: reads ethos, generates Rust."
publish      = false
autobins     = false
autoexamples = false
autotests    = false

[lib]
name = "ethos_zero"
path = "src/lib.rs"

[[bin]]
name = "ethos-zero"
path = "src/main.rs"

[features]
default = ["datom"]
datom = []

[dependencies]
protos      = { git = "https://github.com/LiGoldragon/protos",  rev = "aac95b0d08a4c7eb7f73c8ea18309f9e2e89315f" }
datom-codec = { git = "https://github.com/LiGoldragon/datom-codec", rev = "35d26d822870356af9b04cacfec40d85600b541d" }
quote       = "1"
proc-macro2 = "1"
syn         = { version = "3", features = ["full"] }
prettyplease = "0.3"

[dev-dependencies]
serde = "1"

[[test]]
name = "ethos"
path = "tests/ethos.rs"

[[test]]
name = "generated"
path = "tests/generated.rs"

[[test]]
name = "freshness"
path = "tests/freshness.rs"

[[test]]
name = "signal-without-datom"
path = "tests/signal_without_datom.rs"

[[test]]
name = "cli"
path = "tests/cli.rs"

[lints.rust]
unsafe_code = "forbid"
unused      = { level = "warn", priority = -1 }
dead_code   = "warn"
